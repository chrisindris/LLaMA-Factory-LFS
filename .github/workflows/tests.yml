name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/*.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/*.yml"

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        transformers:
          - ""
        include:  # test backward compatibility
          - python: "3.11"
            os: "ubuntu-latest"
            transformers: "4.55.0"
          - python: "3.11"
            os: "ubuntu-latest"
            transformers: "4.57.1"

    runs-on: ${{ matrix.os }}

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.transformers }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OS_NAME: ${{ matrix.os }}
      UV_NO_SYNC: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Need the merge base so style/quality can git-diff against the PR base
          # (or the previous push on main) instead of linting the whole tree.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          github-token: ${{ github.token }}
          enable-cache: false

      - name: Install dependencies
        run: |
          uv venv
          uv pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e .
          uv pip install -r requirements/dev.txt

      - name: Install transformers
        if: ${{ matrix.transformers }}
        run: |
          uv pip install "transformers==${{ matrix.transformers }}"

      - name: Cache files
        id: hf-hub-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/huggingface
          key: huggingface-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.transformers }}-${{ hashFiles('tests/version.txt') }}

      - name: Collect changed Python files
        id: changed-py
        shell: bash
        run: |
          set -euo pipefail

          # Same scope as Makefile check_dirs, restricted to paths this PR actually touched.
          filter_paths=(scripts src tests tests_v1 setup.py)
          list_file="${{ runner.temp }}/changed_py_files.txt"
          : > "${list_file}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base_sha="${{ github.event.before }}"
            # First push / force-push with no previous tip: fall back to the parent commit.
            if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
              base_sha="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
          else
            # workflow_dispatch: compare against origin/main when available.
            git fetch origin main --depth=1 2>/dev/null || true
            base_sha="$(git merge-base HEAD origin/main 2>/dev/null || true)"
          fi

          if [[ -z "${base_sha}" ]]; then
            echo "No base revision available; skipping style/quality path filter."
            echo "count=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          while IFS= read -r f; do
            [[ -n "${f}" && -f "${f}" ]] && printf '%s\n' "${f}" >> "${list_file}"
          done < <(
            git diff --name-only --diff-filter=ACMR "${base_sha}"...HEAD -- "${filter_paths[@]}" \
              | grep -E '\.py$' || true
          )

          count="$(wc -l < "${list_file}" | tr -d ' ')"
          echo "Base: ${base_sha}"
          echo "Changed Python files (${count}):"
          cat "${list_file}"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

      - name: Check quality (changed files only)
        if: steps.changed-py.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          list_file="${{ runner.temp }}/changed_py_files.txt"
          mapfile -t files < "${list_file}"
          echo "ruff check/format on ${#files[@]} file(s)"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"

      - name: Check quality (skip)
        if: steps.changed-py.outputs.count == '0'
        shell: bash
        run: echo "No changed Python files under scripts/src/tests/tests_v1/setup.py; skipping style/quality."

      - name: Check license
        run: |
          make license

      - name: Check build
        run: |
          make build

      - name: Test with pytest
        run: |
          make test
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
          HF_HUB_OFFLINE: "${{ steps.hf-hub-cache.outputs.cache-hit == 'true' && '1' || '0' }}"
