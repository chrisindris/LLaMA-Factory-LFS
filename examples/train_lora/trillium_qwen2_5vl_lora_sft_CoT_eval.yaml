### Evaluate (and log the model predictions/responses for) a particular model and dataset.
### Submit via models/qwen2_5vl_lora_sft_CoT/${CLUSTER}_slurm_qwen2_5vl_lora_sft_CoT_eval.sh
###
### Prerequisites:
###   question_ids are auto-assigned at convert time as {dataset_name}_{row_index}
###   when annotations lack a stamped column. Optional: scripts/assign_question_ids.py
###   + columns.question_id in dataset_info.json for offline-stamped IDs.
###   Keep overwrite_cache: false for array jobs (shared HF map cache).
###   Set true only on a single job after converter/pipeline changes.

### model
# Local hub snapshot (offline compute nodes cannot reach huggingface.co).
# Equivalent hub id: Qwen/Qwen2.5-VL-7B-Instruct  (also works with HF_HUB_OFFLINE=1 + cache_dir)
model_name_or_path: /scratch/indrisch/huggingface/hub/models--Qwen--Qwen2.5-VL-7B-Instruct/snapshots/cc594898137f460bfe9f0759e9844b3ce807cfb5
cache_dir: /scratch/indrisch/huggingface/hub
image_max_pixels: 65536
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: false
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
# max_samples truncates EACH listed dataset before concat — keeps the smoke job short.
dataset: Scene30k,SpatialSSRL_coldstart,3DThinker10k
mix_strategy: concat
media_dir: /project/def-wangcs/indrisch/scratch_saves/ScanNet_h5
template: qwen2_vl
# MUST match production CoT (131072). A short cutoff (e.g. 8192) truncates <|image_pad|>
# tokens while the collator still encodes all images →
# "Image features and image tokens do not match: tokens: N, features M".
cutoff_len: 131072
# Optional: fewer frames/images per sample for a faster smoke (keeps token/feature alignment).
# image_sample_count: 8
overwrite_cache: false # prevents multiple co-running programs from colliding on the HuggingFace cache (which can lead to memory errors)
preprocessing_batch_size: 32 # VL map decodes images; default 1000 OOMs num_proc workers
preprocessing_num_workers: 8
dataloader_num_workers: 2
dataloader_prefetch_factor: 1
dataloader_pin_memory: false
low_cpu_mem_usage: true

### output
output_dir: saves/qwen2_5vl-7b/lora/sft/CoT_prediction_dump_smoke
logging_steps: 1
save_steps: 50
plot_loss: false
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 1.0
max_steps: 4
lr_scheduler_type: cosine
warmup_ratio: 0.0
bf16: true
ddp_timeout: 180000000

### prediction dumps (the feature under test)
save_train_predictions: true
train_prediction_mode: teacher_forced   # use generate only if you accept much slower smoke
train_prediction_interval: 1
train_prediction_max_samples: 16
# train_predictions_file: null  # default: {output_dir}/train_predictions.json

save_eval_predictions: true
eval_prediction_mode: teacher_forced    # generate is slower; switch when validating free-form dumps
# eval_predictions_file: null           # default: {output_dir}/eval_predictions.json

# generation knobs (used when *prediction_mode: generate)
max_new_tokens: 2048

### optional mm memory debug (independent of prediction dumps)
# debug_mm_training: true
# debug_mm_steps: 1

### acceleration
flash_attn: fa2
enable_liger_kernel: true

### distribution
deepspeed: examples/deepspeed/ds_z3_config.json

### eval
do_eval: true
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 620 # evaluate after every ~1.00 CoT epoch
