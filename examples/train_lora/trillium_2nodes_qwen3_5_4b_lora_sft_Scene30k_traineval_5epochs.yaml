### model
model_name_or_path: Qwen/Qwen3.5-4B
# cache_dir is intentionally unset so HF_DATASETS_CACHE can point to node-local storage.
image_max_pixels: 65536
video_max_pixels: 16384
use_fast_tokenizer: false
# giving the slow tokenizer a try: https://github.com/hiyouga/LLaMA-Factory/issues/8600#issuecomment-3227071979
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset; https://llamafactory.readthedocs.io/en/latest/advanced/arguments.html#id4
dataset: Scene30k
# max_samples: 1000 # for debugging; set to null or remove for full dataset
media_dir: /project/def-wangcs/shared/data/
template: qwen3_5
cutoff_len: 16384 # Reduce from model_len=131072 to avoid OOM; lowering to 8192 works on l40s, on H100s we can use 16384.
overwrite_cache: false # prevents multiple co-running programs from colliding on the HuggingFace cache (which can lead to memory errors)
preprocessing_num_workers: 8 # note: this number should be equal to 16 divided by the number of nodes being used, to reduce worker fan-out to avoid file-lock pressure on multi-node runs
dataloader_num_workers: 4
dataloader_prefetch_factor: 1 # when dataloader_num_workers > 0, this argument specifies the number of batches loaded in advance by each worker. Setting it to 1 can help reduce memory usage when working with large multimodal data.
dataloader_pin_memory: false
low_cpu_mem_usage: true

### output
output_dir: saves/qwen3_5-4b/lora/sft/Scene30k_traineval_2nodes_5epochs
logging_steps: 10
save_steps: 213 # Save after every 1.00 Scene30k epochs. This value should be 1704 / number_of_total_gpus; here, we are using 2 nodes x 4 H100 GPUs.
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1 # preferred by Qwen3
gradient_accumulation_steps: 16 # preferred by Qwen3
gradient_checkpointing: true # reduces activation memory; trades speed for stability
learning_rate: 1.0e-4
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
# pure_bf16: true # pure_bf16` is incompatible with DeepSpeed ZeRO-3 (*3874065.out)
ddp_timeout: 180000000
resume_from_checkpoint: null

# debugging level
debug: underflow_overflow
log_level: debug
log_level_replica: debug
print_param_status: true
debug_mm_training: true # this is really for fine-grained debugging of memory usage; for runs, output is much cleaner if we turn this off.
# debug_mm_steps: 1
# image_sample_stride: 16 # use every 16th image frame when on l40s GPUs.
image_sample_count: 32 # using at most 24 works on l40s; use 32 on H100s.

# acceleration
flash_attn: fa2
enable_liger_kernel: true

# distribution
deepspeed: examples/deepspeed/ds_z3_offload_config.json # for Qwen3.5, ds_z2_config.json leads to OOM on 80GB. 

## eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 213 # Evaluate after every 1.00 Scene30k epochs. This value should be 1704 / number_of_total_gpus; here, we are using 2 nodes x 4 H100 GPUs.
