### Smoke config: exercise save_train_predictions / save_eval_predictions on a tiny CoT slice.
### Submit via models/qwen2_5vl_lora_sft_CoT/trillium_slurm_qwen2_5vl_lora_sft_CoT_prediction_dump_smoke.sh
### Do NOT use for full training runs.
###
### Prerequisites:
###   1. Stamp question_ids on the CoT annotation files, e.g.:
###        python scripts/assign_question_ids.py \
###          --from-dataset-info data/dataset_info.json \
###          --datasets Scene30k,SpatialSSRL_coldstart,3DThinker10k
###      then point dataset_info file_name at the new paths and add
###        "question_id": "question_id" under each dataset's columns
###      (or re-run with --update-dataset-info).
###   2. Prefer overwrite_cache: true once after stamping so the new column is aligned.

### model
# Local hub snapshot (offline compute nodes cannot reach huggingface.co).
# Equivalent hub id: Qwen/Qwen2.5-VL-7B-Instruct  (also works with HF_HUB_OFFLINE=1 + cache_dir)
model_name_or_path: /scratch/indrisch/huggingface/hub/models--Qwen--Qwen2.5-VL-7B-Instruct/snapshots/cc594898137f460bfe9f0759e9844b3ce807cfb5
cache_dir: /scratch/indrisch/huggingface/hub
image_max_pixels: 65536
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
# max_samples truncates EACH listed dataset before concat — keeps the smoke job short.
dataset: Scene30k,SpatialSSRL_coldstart,3DThinker10k
mix_strategy: concat
max_samples: 8
media_dir: /project/def-wangcs/indrisch/scratch_saves/ScanNet_h5
template: qwen2_vl
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 2
dataloader_prefetch_factor: 1
dataloader_pin_memory: false
low_cpu_mem_usage: true

### output
output_dir: saves/qwen2_5vl-7b/lora/sft/CoT_prediction_dump_smoke
logging_steps: 1
save_steps: 50
plot_loss: false
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 1.0
max_steps: 4
lr_scheduler_type: cosine
warmup_ratio: 0.0
bf16: true
ddp_timeout: 180000000

### prediction dumps (the feature under test)
save_train_predictions: true
train_prediction_mode: teacher_forced   # use generate only if you accept much slower smoke
train_prediction_interval: 1
train_prediction_max_samples: 16
# train_predictions_file: null  # default: {output_dir}/train_predictions.json

save_eval_predictions: true
eval_prediction_mode: teacher_forced    # generate is slower; switch when validating free-form dumps
# eval_predictions_file: null           # default: {output_dir}/eval_predictions.json

# generation knobs (used when *prediction_mode: generate)
max_new_tokens: 128

### optional mm memory debug (independent of prediction dumps)
# debug_mm_training: true
# debug_mm_steps: 1

### acceleration
flash_attn: fa2
enable_liger_kernel: true

### distribution
deepspeed: examples/deepspeed/ds_z2_config.json

### eval
val_size: 0.25
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 2
